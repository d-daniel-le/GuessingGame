<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Daniel Le">
    <script>

        // Initialize variable
        let randomNumber;
        let count;
        let userInput;
        let guess;
        let contGame;

        // Game start until the user wants to stop
        do {

            count = 0;
            
            // Generate a random number
            randomNumber = Math.floor(Math.random() * 10) +1;

            // Prompt user to guess a number between 1 and 10
            userInput = prompt('Guess a Number between 1 and 10.');

            // Processing guesses
            do {

                guess = false;

                // If the user guess is too high
                if (userInput > randomNumber){
                    userInput = prompt('Your guess was too high, guess again.');
                    count += 1;
                }

                // If the user guess is too low
                else if (userInput < randomNumber){
                    userInput = prompt('Your guess was too low, guess again.');
                    count += 1;
                }

                // If the user guess matches the number
                else{
                    alert('Your guess was correct!')
                    count += 1;
                    alert(`You guessed it in ${count} guesses!`);

                    guess = true;
                }
            } while (guess === false);

            // Ask the user if they want to play again
            contGame = prompt('Would you like to play again (y/n)?');

        } while (contGame.toLowerCase() === 'y');
    </script>
    <title>Guessing Game</title>
  </head>
  <body>
    <h1>Guessing Game</h1>
        <div>
            <p id="random-number"></p>
            <script>

                document.getElementById("random-number").innerHTML = randomNumber;
                console.log(randomNumber);

            </script>
        </div>
 </body>
</html>
